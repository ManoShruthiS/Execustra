<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0a0a0a" />
            <stop offset="100%" stop-color="#111827" />
        </linearGradient>
        <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="100%" stop-color="#3b82f6" />
        </linearGradient>
    </defs>
    
    <!-- Background -->
    <rect width="1200" height="400" fill="url(#bg)" />
    
    <!-- Subtle Blueprint Grid -->
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400 M800 0 V400 M900 0 V400 M1000 0 V400 M1100 0 V400" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    
    <!-- Title -->
    <text x="120" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="86" font-weight="800" fill="#ffffff" letter-spacing="-2">ExecuStra</text>
    
    <!-- Subtitle -->
    <text x="125" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#9ca3af" letter-spacing="3">ADAPTIVE LIFE OPERATING SYSTEM</text>

    <!-- Version Badge -->
    <rect x="125" y="100" width="110" height="32" rx="16" fill="#1f2937" />
    <circle cx="145" cy="116" r="4" fill="#10b981" />
    <text x="160" y="121" font-family="monospace" font-size="14" font-weight="600" fill="#d1d5db">v1.0.0-live</text>

    <!-- UI Mock Element: The Execution Ring -->
    <g transform="translate(850, 200)">
        <circle cx="0" cy="0" r="130" fill="none" stroke="#1f2937" stroke-width="24" />
        <path d="M 0 -130 A 130 130 0 1 1 -110 65" fill="none" stroke="url(#glow)" stroke-width="24" stroke-linecap="round" />
        <text x="0" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="#ffffff" text-anchor="middle">85%</text>
        <text x="0" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#9ca3af" text-anchor="middle" letter-spacing="2">EXECUTION</text>
    </g>
    
    <!-- Data Nodes / Code Accents -->
    <rect x="680" y="80" width="6" height="6" fill="#3b82f6" opacity="0.8" />
    <rect x="680" y="94" width="20" height="2" fill="#3b82f6" opacity="0.4" />
    <rect x="680" y="104" width="40" height="2" fill="#3b82f6" opacity="0.2" />
    
    <rect x="680" y="280" width="6" height="6" fill="#10b981" opacity="0.8" />
    <rect x="680" y="294" width="30" height="2" fill="#10b981" opacity="0.4" />
    <rect x="680" y="304" width="15" height="2" fill="#10b981" opacity="0.2" />
</svg>
